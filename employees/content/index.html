<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Content Editor — Piece Pavilion Staff</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --red:#e3000b; --yellow:#ffce00; --blue:#0057a8; --ink:#15151f;
    --mid:#6b7280; --line:#e6e8ec; --bg:#f5f6f9; --surface:#fff; --cream:#fff8ec;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:linear-gradient(135deg,#15151f 0%,#2c0c0c 55%,#4a0a10 100%);
    color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px;
    box-shadow:inset 0 -2px 0 0 rgba(255,206,0,.55); flex-shrink:0; }
  .topbar img { height:40px; border-radius:50%; }
  .topbar h1 { font-size:1.2rem; color:#fff; font-weight:800; }
  .topbar .crumb { font-size:.85rem; color:rgba(255,255,255,.78); font-weight:700; margin-right:6px; }
  .topbar .back { margin-left:auto; color:#fff; text-decoration:none; font-weight:800; font-size:.86rem;
    border:1.5px solid rgba(255,255,255,.4); border-radius:50px; padding:7px 14px; }
  .topbar .back:hover { background:rgba(255,255,255,.14); }

  .tabs { background:#fff; border-bottom:1px solid var(--line); padding:0 24px;
    display:flex; gap:2px; flex-shrink:0; overflow-x:auto; }
  .tab { font:inherit; background:transparent; border:0; cursor:pointer;
    padding:14px 22px 12px; font-weight:800; color:var(--mid);
    border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
    display:inline-flex; align-items:center; gap:8px; font-size:.95rem; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--red); border-bottom-color:var(--red); }
  .tab .ico { font-size:1.1rem; }

  .panes { flex:1; min-height:0; position:relative; background:var(--bg); }
  .pane { position:absolute; inset:0; display:none; }
  .pane.active { display:block; }
  .pane iframe { width:100%; height:100%; border:0; display:block; background:var(--bg); }
</style>
</head>
<body>
<header class="topbar">
  <img src="/logo-white.png" alt="" onerror="this.style.display='none'" />
  <div><span class="crumb">Staff /</span><h1 style="display:inline;">Content Editor</h1></div>
  <a class="back" href="/employees/">&larr; Staff home</a>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-pane="magazine" aria-selected="false"><span class="ico">&#128240;</span> Newsroom article</button>
  <button class="tab active" role="tab" data-pane="featured" aria-selected="true">
    <span class="ico">&#11088;</span> Featured items
  </button>
  <button class="tab" role="tab" data-pane="spotlight" aria-selected="false">
    <span class="ico">&#128250;</span> Newsroom slideshow
  </button>
  <button class="tab" role="tab" data-pane="breaking-news" aria-selected="false"><span class="ico" aria-hidden="true">&#128308;</span> Breaking News</button>
</div>
<div class="panes">
  <section class="pane" id="pane-magazine" role="tabpanel"><iframe src="/employees/magazine/?embed=1" title="Newsroom article editor"></iframe></section>
  <section class="pane active" id="pane-featured" role="tabpanel">
    <iframe src="/employees/featured-items/?embed=1" title="Featured items editor"></iframe>
  </section>
  <section class="pane" id="pane-spotlight" role="tabpanel">
    <iframe src="/employees/spotlight/?embed=1" title="Newsroom slideshow editor"></iframe>
  </section>
  <section class="pane" id="pane-breaking-news" role="tabpanel"><iframe src="/employees/breaking-news/?embed=1&amp;v=20261111mobile-controls" title="Breaking News editor"></iframe></section>
</div>
<script>
  // Start on whichever tab the URL hash names (#featured / #spotlight).
  const want = (location.hash || '').replace('#', '');
  if (want === 'spotlight' || want === 'featured' || want === 'magazine' || want === 'breaking-news') {
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.pane === want;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + want));
  }
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.pane;
      document.querySelectorAll('.tab').forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on); t.setAttribute('aria-selected', on);
      });
      document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
      history.replaceState(null, '', '#' + name);
    });
  });
</script>
</body>
</html>
