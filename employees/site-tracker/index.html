<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Site Tracker — Piece Pavilion Staff</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --red:#e3000b; --yellow:#ffce00; --blue:#0057a8; --ink:#15151f;
    --mid:#6b7280; --line:#e6e8ec; --bg:#f5f6f9; --surface:#fff; --cream:#fff8ec;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:linear-gradient(135deg,#15151f 0%,#2c0c0c 55%,#4a0a10 100%);
    color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px;
    box-shadow:inset 0 -2px 0 0 rgba(255,206,0,.55); flex-shrink:0; }
  .topbar img { height:40px; border-radius:50%; }
  .topbar h1 { font-size:1.2rem; color:#fff; font-weight:800; }
  .topbar .crumb { font-size:.85rem; color:rgba(255,255,255,.78); font-weight:700; margin-right:6px; }
  .topbar .back { margin-left:auto; color:#fff; text-decoration:none; font-weight:800; font-size:.86rem;
    border:1.5px solid rgba(255,255,255,.4); border-radius:50px; padding:7px 14px; }
  .topbar .back:hover { background:rgba(255,255,255,.14); }

  .tabs { background:#fff; border-bottom:1px solid var(--line); padding:0 24px;
    display:flex; gap:2px; flex-shrink:0; overflow-x:auto; }
  .tab { font:inherit; background:transparent; border:0; cursor:pointer;
    padding:14px 22px 12px; font-weight:800; color:var(--mid);
    border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
    display:inline-flex; align-items:center; gap:8px; font-size:.95rem; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--red); border-bottom-color:var(--red); }
  .tab .ico { font-size:1.1rem; }
  .tab .ver { background:var(--yellow); color:var(--ink); font-size:.65rem;
    padding:2px 7px; border-radius:50px; margin-left:4px; }

  .panes { flex:1; min-height:0; position:relative; background:var(--bg); }
  .pane { position:absolute; inset:0; display:none; }
  .pane.active { display:block; }
  .pane iframe { width:100%; height:100%; border:0; display:block; background:var(--bg); }
</style>
</head>
<body>
<header class="topbar">
  <img src="/logo-white.png" alt="" onerror="this.style.display='none'" />
  <div><span class="crumb">Staff /</span><h1 style="display:inline;">Site Tracker</h1></div>
  <a class="back" href="/employees/">&larr; Staff home</a>
</header>
<div class="tabs" role="tablist">
  <button class="tab active" role="tab" data-pane="site" aria-selected="true">
    <span class="ico">&#128295;</span> Site Tracker <span class="ver">v1 (Sheets)</span>
  </button>
  <button class="tab" role="tab" data-pane="banner" aria-selected="false">
    <span class="ico">&#128226;</span> Site Tracker <span class="ver">v2.0 (Banner)</span>
  </button>
  <button class="tab" role="tab" data-pane="blog-edition" aria-selected="false" aria-controls="pane-blog-edition" id="tab-blog-edition" style="white-space:nowrap;">
    <span class="ico" aria-hidden="true">&#128221;</span> Site Tracker <span class="ver">Blog Edition</span>
  </button>
  <button class="tab" role="tab" data-pane="countdown" aria-selected="false">
    <span class="ico">&#9201;</span> Countdown
  </button>
</div>
<div class="panes">
  <section class="pane active" id="pane-site" role="tabpanel">
    <iframe src="/employees/site-editor/?embed=1" title="Site Tracker (Google Sheet)"></iframe>
  </section>
  <section class="pane" id="pane-banner" role="tabpanel">
    <iframe src="/employees/banner-editor/?embed=1" title="Site Tracker 2.0 (KV banner editor)"></iframe>
  </section>
  <section class="pane" id="pane-blog-edition" role="tabpanel" aria-labelledby="tab-blog-edition">
    <template id="blog-edition-frame-template"><iframe title="Site Tracker Blog Edition" srcdoc="&lt;!doctype html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;base href=&quot;/&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
  &lt;meta name=&quot;robots&quot; content=&quot;noindex,nofollow&quot;&gt;
  &lt;link rel=&quot;icon&quot; href=&quot;/favicon.svg&quot; type=&quot;image/svg+xml&quot;&gt;
  &lt;title&gt;Site Tracker Blog Edition — Piece Pavilion Staff&lt;/title&gt;
  &lt;style&gt;
    :root { font-family: Nunito, system-ui, sans-serif; color:#15151f; background:#f5f6f9; --line:#dce0e8; }
    *, *::before, *::after { box-sizing:border-box; }
    body { margin:0; }
    main { width:min(100% - 32px, 42rem); margin:0 auto; padding:32px 0; }
    .back { display:inline-block; margin-bottom:12px; color:#174e96; }
    body.embed .back { display:none; }

    p { color:#475569; margin:0 0 16px; }
    .panel { border-radius:14px; border:1px solid var(--line); background:#fff; padding:clamp(14px,4vw,25px); }
    label { display:block; margin:0 0 6px; font-weight:750; }
    select, textarea, button { font:inherit; }
    select, textarea { width:100%; min-width:0; color:inherit; background:#fff; border-radius:9px; border:1px solid #8993a3; padding:10px; }
    select { min-height:44px; }
    textarea { display:block; min-height:9rem; resize:vertical; }
    select:focus-visible, textarea:focus-visible, a:focus-visible, button:focus-visible { outline:3px solid #0057a8; outline-offset:2px; }
    textarea:disabled, select:disabled { background:#f5f6f9; }
    #status { display:block; margin:15px 0 0; min-height:1.3em; font-size:.93rem; color:#264566; }
    #status[data-level=&quot;error&quot;], #word-count.over { color:#a30d16; }

  &lt;/style&gt;
&lt;/head&gt;
&lt;body class=&quot;embed&quot;&gt;
  &lt;main&gt;
    &lt;a class=&quot;back&quot; href=&quot;/employees/site-tracker/#blog-edition&quot;&gt;&amp;larr; Back to Site Tracker&lt;/a&gt;
    &lt;h1&gt;Site Tracker Blog Edition&lt;/h1&gt;
    &lt;p&gt;Show a short note on one post or all blogs. A post with its own note shows that note instead.&lt;/p&gt;
    &lt;form class=&quot;panel&quot; id=&quot;editor&quot;&gt;
      &lt;label for=&quot;post&quot;&gt;Published blog&lt;/label&gt;
      &lt;select id=&quot;post&quot; disabled&gt;&lt;option value=&quot;&quot;&gt;Loading published blogs…&lt;/option&gt;&lt;/select&gt;
      &lt;a id=&quot;view&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; hidden&gt;Open public post &amp;nearr;&lt;/a&gt;
      &lt;label for=&quot;message&quot;&gt;Message&lt;/label&gt;
      &lt;textarea id=&quot;message&quot; rows=&quot;6&quot; maxlength=&quot;6000&quot; aria-describedby=&quot;word-count&quot; placeholder=&quot;Type a message for readers…&quot; disabled&gt;&lt;/textarea&gt;
      &lt;small id=&quot;word-count&quot;&gt;0 / 230 words&lt;/small&gt;
      &lt;div id=&quot;actions&quot;&gt;
        &lt;button id=&quot;save&quot; type=&quot;submit&quot; disabled&gt;Publish message&lt;/button&gt;
        &lt;button id=&quot;remove&quot; type=&quot;button&quot; disabled&gt;Remove message&lt;/button&gt;
        &lt;button id=&quot;reload&quot; type=&quot;button&quot; disabled&gt;Reload saved message&lt;/button&gt;
      &lt;/div&gt;
      &lt;output id=&quot;status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/output&gt;
    &lt;/form&gt;
  &lt;/main&gt;
  &lt;script&gt;
    (() =&gt; {
      &#x27;use strict&#x27;;
      const STAFF_API = &#x27;/employees/api/magazine/blog-note&#x27;;
      const limit = 230, ALL = &#x27;__all__&#x27;;
      const el = id =&gt; document.getElementById(id);
      const post = el(&#x27;post&#x27;), message = el(&#x27;message&#x27;), save = el(&#x27;save&#x27;), remove = el(&#x27;remove&#x27;);
      const reload = el(&#x27;reload&#x27;), status = el(&#x27;status&#x27;), view = el(&#x27;view&#x27;), count = el(&#x27;word-count&#x27;);
      let selected = &#x27;&#x27;, saved = &#x27;&#x27;, revision = null, loaded = false, busy = false, loadToken = 0;
      const tally = value =&gt; (value.match(/[\p{L}\p{N}]+[\p{L}\p{M}\p{N}]*(?:[&#x27;’-][\p{L}\p{N}]+[\p{L}\p{M}\p{N}]*)*/gu) || []).length;
      const notice = (text, error = false) =&gt; { status.textContent = text; status.dataset.level = error ? &#x27;error&#x27; : &#x27;&#x27;; };
      function showState() {
        const words = tally(message.value);
        count.textContent = words + &#x27; / &#x27; + limit + &#x27; words&#x27;;
        count.classList.toggle(&#x27;over&#x27;, words &gt; limit);
        post.disabled = busy || !post.options.length;
        message.disabled = busy || !loaded;
        save.disabled = busy || !loaded || !message.value.trim() || message.value.trim() === saved || words &gt; limit;
        remove.disabled = busy || !loaded || !saved;
        reload.disabled = busy || !selected;
      }
      async function getData(slug, value) {
        const isWrite = value !== undefined;
        const response = await fetch(STAFF_API + &#x27;?slug=&#x27; + encodeURIComponent(slug), {
          method: isWrite ? &#x27;PUT&#x27; : &#x27;GET&#x27;, credentials: &#x27;same-origin&#x27;, cache: &#x27;no-store&#x27;,
          ...(isWrite ? { headers: { &#x27;content-type&#x27;: &#x27;application/json&#x27; }, body: JSON.stringify({ message:value, revision }) } : {}),
        });
        const type = response.headers.get(&#x27;content-type&#x27;) || &#x27;&#x27;;
        if (response.redirected || response.status === 401) throw new Error(&#x27;Your staff session expired. Open Staff and sign in again.&#x27;);
        if (!type.includes(&#x27;application/json&#x27;)) throw new Error(&#x27;The message service is not available yet.&#x27;);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || &#x27;Could not reach the message service.&#x27;);
        if (data.slug !== slug || typeof data.message !== &#x27;string&#x27;) throw new Error(&#x27;The message service returned an unexpected response.&#x27;);
        return data;
      }
      async function selectPost(slug) {
        const token = ++loadToken;
        selected = slug;
        loaded = false;
        saved = message.value = &#x27;&#x27;;
        revision = null;
        view.hidden = !slug;
        if (slug) {
          view.href = slug === ALL ? &#x27;/blog/&#x27; : &#x27;/blog/&#x27; + encodeURIComponent(slug) + &#x27;/&#x27;;
          view.textContent = slug === ALL ? &#x27;Open the public blog ↗&#x27; : &#x27;Open public post ↗&#x27;;
        }
        showState();
        notice(slug ? &#x27;Loading the saved message…&#x27; : &#x27;&#x27;);
        if (!slug) return;
        try {
          const data = await getData(slug);
          if (token !== loadToken) return;
          saved = message.value = data.message;
          revision = data.revision;
          loaded = true;
          notice(slug === ALL ? (saved ? &#x27;This shared message is public.&#x27; : &#x27;No all-blogs message is set.&#x27;) :
            (saved ? &#x27;This post’s own message is public.&#x27; : &#x27;No individual message. This post uses the all-blogs message if one is set.&#x27;));
        } catch (error) {
          if (token === loadToken) notice(error.message, true);
        } finally {
          if (token === loadToken) showState();
        }
      }
      async function publish(value) {
        if (!loaded || busy) return;
        busy = true;
        showState();
        notice(value ? &#x27;Publishing message…&#x27; : &#x27;Removing message…&#x27;);
        try {
          const data = await getData(selected, value);
          saved = message.value = data.message;
          revision = data.revision;
          notice(selected === ALL ? (saved ? &#x27;All-blogs message published.&#x27; : &#x27;All-blogs message removed. Individual messages were kept.&#x27;) :
            (saved ? &#x27;Message published on this post.&#x27; : &#x27;Individual message removed. The all-blogs message will show if one is set.&#x27;));
        } catch (error) {
          notice(error.message, true);
        } finally {
          busy = false;
          showState();
        }
      }
      async function populate() {
        try {
          const response = await fetch(&#x27;/blog/&#x27;, { credentials:&#x27;omit&#x27;, cache:&#x27;no-store&#x27; });
          if (!response.ok) throw new Error();
          const doc = new DOMParser().parseFromString(await response.text(), &#x27;text/html&#x27;);
          const used = new Set();
          post.replaceChildren(new Option(&#x27;Choose where to show the message…&#x27;, &#x27;&#x27;), new Option(&#x27;All Blogs&#x27;, ALL));
          for (const card of doc.querySelectorAll(&#x27;.blog-cards .blog-card[href]&#x27;)) {
            const path = card.getAttribute(&#x27;href&#x27;);
            const slug = /^\/blog\/([a-z0-9]+(?:-[a-z0-9]+)*)\/$/.exec(path)?.[1];
            const title = card.querySelector(&#x27;h2&#x27;)?.textContent.trim();
            if (!slug || slug.length &gt; 130 || !title || used.has(slug)) continue;
            used.add(slug);
            post.add(new Option(title, slug));
          }
          if (!used.size) throw new Error();
          showState();
        } catch {
          post.replaceChildren(new Option(&#x27;Choose where to show the message…&#x27;, &#x27;&#x27;), new Option(&#x27;All Blogs&#x27;, ALL));
          showState();
          notice(&#x27;Individual blogs did not load. You can still use All Blogs.&#x27;, true);
        }
      }
      post.addEventListener(&#x27;change&#x27;, () =&gt; {
        if (loaded &amp;&amp; message.value.trim() !== saved &amp;&amp; !confirm(&#x27;Discard your unsaved changes?&#x27;)) {
          post.value = selected;
          return;
        }
        selectPost(post.value);
      });
      message.addEventListener(&#x27;input&#x27;, showState);
      reload.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!loaded || message.value.trim() === saved || confirm(&#x27;Discard your unsaved changes?&#x27;)) selectPost(selected);
      });
      remove.addEventListener(&#x27;click&#x27;, () =&gt; { if (saved &amp;&amp; confirm(selected === ALL ? &#x27;Remove the shared message from all blogs? Individual notes will stay.&#x27; : &#x27;Remove this post’s own message?&#x27;)) publish(&#x27;&#x27;); });
      el(&#x27;editor&#x27;).addEventListener(&#x27;submit&#x27;, event =&gt; {
        event.preventDefault();
        if (!save.disabled &amp;&amp; (selected !== ALL || confirm(&#x27;Publish this note on all blogs that don’t have their own note?&#x27;))) publish(message.value.trim());
      });
      populate();
    })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></template>
  </section>
  <section class="pane" id="pane-countdown" role="tabpanel">
    <iframe src="/employees/countdown-editor/?embed=1&v=20261110confetti1" title="Homepage countdown editor"></iframe>
  </section>
</div>
<script>
  function mountBlogEdition(name) {
    if (name !== 'blog-edition') return;
    const tmpl = document.getElementById('blog-edition-frame-template');
    if (tmpl) tmpl.replaceWith(tmpl.content.cloneNode(true));
  }
  const want = (location.hash || '').replace('#', '');
  if (want === 'site' || want === 'banner' || want === 'countdown' || want === 'blog-edition') {
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.pane === want;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on);
    });
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + want));
    mountBlogEdition(want);
  }
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.pane;
      document.querySelectorAll('.tab').forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on); t.setAttribute('aria-selected', on);
      });
      document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
      mountBlogEdition(name);
      history.replaceState(null, '', '#' + name);
    });
  });
</script>
