<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Site Tracker — Piece Pavilion Staff</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --red:#e3000b; --yellow:#ffce00; --blue:#0057a8; --ink:#15151f;
    --mid:#6b7280; --line:#e6e8ec; --bg:#f5f6f9; --surface:#fff; --cream:#fff8ec;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh; }
  .topbar { background:linear-gradient(135deg,#15151f 0%,#2c0c0c 55%,#4a0a10 100%);
    color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px;
    box-shadow:inset 0 -2px 0 0 rgba(255,206,0,.55); flex-shrink:0; }
  .topbar img { height:40px; border-radius:50%; }
  .topbar h1 { font-size:1.2rem; color:#fff; font-weight:800; }
  .topbar .crumb { font-size:.85rem; color:rgba(255,255,255,.78); font-weight:700; margin-right:6px; }
  .topbar .back { margin-left:auto; color:#fff; text-decoration:none; font-weight:800; font-size:.86rem;
    border:1.5px solid rgba(255,255,255,.4); border-radius:50px; padding:7px 14px; }
  .topbar .back:hover { background:rgba(255,255,255,.14); }

  .split { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr;
    gap:1px; background:var(--line); }
  .col { background:var(--bg); display:flex; flex-direction:column; min-width:0; min-height:0; }
  .col-head { background:#fff; border-bottom:1px solid var(--line);
    padding:12px 18px; font-weight:800; font-size:.95rem;
    display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .col-head .ico { font-size:1.1rem; }
  .col-head .ver { background:var(--yellow); color:var(--ink); font-size:.65rem;
    padding:2px 8px; border-radius:50px; font-weight:800; }
  .col iframe { flex:1; width:100%; border:0; display:block; background:var(--bg); min-height:0; }

  /* Below 1000px, stack the two columns vertically so each is still usable. */
  @media (max-width: 1000px) {
    .split { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <img src="/logo-white.png" alt="" onerror="this.style.display='none'" />
  <div><span class="crumb">Staff /</span><h1 style="display:inline;">Site Tracker</h1></div>
  <a class="back" href="/employees/">&larr; Staff home</a>
</header>
<div class="split">
  <section class="col">
    <div class="col-head">
      <span class="ico">&#128295;</span> Site Tracker <span class="ver">v1 (Sheets)</span>
    </div>
    <iframe src="/employees/site-editor/?embed=1" title="Site Tracker (Google Sheet)"></iframe>
  </section>
  <section class="col">
    <div class="col-head">
      <span class="ico">&#128226;</span> Site Tracker <span class="ver">v2.0 (Banner)</span>
    </div>
    <iframe src="/employees/banner-editor/?embed=1" title="Site Tracker 2.0 (KV banner editor)"></iframe>
  </section>
</div>
</body>
</html>
