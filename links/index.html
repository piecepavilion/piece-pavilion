<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piece Pavilion — Links</title>
  <meta name="description" content="Shop our BrickLink store, read the blog, see new arrivals, and join our list — all in one place." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://piecepavilion.com/links/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#e3000b" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3DK777DPM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X3DK777DPM');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',system-ui,sans-serif;color:#14161d;min-height:100vh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%),
        conic-gradient(from 45deg at 50% 50%, #ff6a33 0deg 90deg, #ffd23d 90deg 180deg, #2ba3e8 180deg 270deg, #34bd57 270deg 360deg);
      background-attachment:fixed;
      display:flex;align-items:flex-start;justify-content:center;padding:40px 18px 60px}
    .card{width:100%;max-width:460px;text-align:center}
    .mark{height:96px;width:96px;margin:0 auto 14px;display:block;
      filter:drop-shadow(0 8px 16px rgba(20,22,29,.28))}
    h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.9rem;color:#14161d}
    .tag{font-weight:700;color:#2c313c;margin:4px 0 4px;font-size:.95rem}
    .rating{font-size:.85rem;font-weight:800;color:#14161d;margin-bottom:22px}
    .rating .stars{color:#f5b301;letter-spacing:1px}
    a.link{display:flex;align-items:center;gap:12px;width:100%;background:rgba(255,255,255,.96);
      border:1px solid rgba(20,22,29,.06);border-radius:16px;padding:16px 20px;margin-bottom:14px;
      text-decoration:none;color:#14161d;font-weight:800;font-size:1.02rem;
      box-shadow:0 6px 18px rgba(20,22,29,.12);transition:transform .12s, box-shadow .12s}
    a.link:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(20,22,29,.18)}
    a.link .ico{font-size:1.4rem;width:28px;text-align:center;flex-shrink:0}
    a.link .arrow{margin-left:auto;color:#e3000b;font-weight:900}
    a.primary{background:#e3000b;color:#fff;border-color:#e3000b}
    a.primary .arrow{color:#fff}
    .foot{margin-top:22px;font-size:.82rem;color:#14161d;font-weight:700}
    .foot a{color:#14161d}
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/logo-white.png" alt="Piece Pavilion" />
    <h1>Piece Pavilion</h1>
    <p class="tag">Where every piece finds its place.</p>
    <p class="rating"><span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span> 100% positive on BrickLink</p>

    <a class="link primary" href="https://store.bricklink.com/PiecePavilion?p=PiecePavilion#/shop" target="_blank" rel="noopener">
      <span class="ico">&#128722;</span> Shop our BrickLink store <span class="arrow">&rarr;</span>
    </a>
    <a class="link" href="https://piecepavilion.com/#newest">
      <span class="ico">&#127381;</span> See what's just added <span class="arrow">&rarr;</span>
    </a>
    <a class="link" href="https://piecepavilion.com/blog/">
      <span class="ico">&#128214;</span> Read the blog <span class="arrow">&rarr;</span>
    </a>
    <a class="link" href="https://piecepavilion.com/#newsletter">
      <span class="ico">&#9993;&#65039;</span> Get new-inventory alerts <span class="arrow">&rarr;</span>
    </a>
    <a class="link" href="https://piecepavilion.com/#sell">
      <span class="ico">&#128176;</span> Sell or consign your LEGO <span class="arrow">&rarr;</span>
    </a>
    <a class="link" href="https://piecepavilion.com/">
      <span class="ico">&#127968;</span> Visit our website <span class="arrow">&rarr;</span>
    </a>

    <p class="foot">Follow <a href="https://www.instagram.com/piecepavilion" target="_blank" rel="noopener">@piecepavilion</a></p>
  </main>
  <script>
    // Track which link-in-bio button gets tapped, and flag BrickLink clicks
    // as conversions (same `bricklink_click` event used site-wide).
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (!a || typeof gtag !== 'function') return;
      var href = a.getAttribute('href') || '';
      var label = (a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);
      gtag('event', 'link_in_bio_click', { link_url: href, link_text: label });
      if (href.indexOf('store.bricklink.com') > -1) {
        gtag('event', 'bricklink_click', { link_url: href, click_location: 'link_in_bio' });
      }
    }, { capture: true });
  </script>
</body>
</html>
