name: Rebuild blog listing

# Triggered when any blog post lands or changes: rebuild blog/index.html
# card list from blog/*/index.html on disk, refresh the "New on the Blog"
# banner on the homepage and the listing page.
on:
  push:
    branches: [main]
    paths:
      - 'blog/**/index.html'
      - 'scripts/rebuild_blog_listing.py'
      - '!blog/index.html'
      - '!blog/_template.html'
  workflow_dispatch:

concurrency:
  group: rebuild-blog-listing
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Need full history so `git log -1 --format=%aI -- blog/<slug>/index.html`
          # can find the post's actual publish commit time (shallow clone
          # wouldn't carry it, and latest.json would fall back to "now"
          # which is fine but less accurate on rebuilds).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install Pillow==11.0.0
      - name: Rebuild cards + banner + auto-thumbs
        run: python scripts/rebuild_blog_listing.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard thumb/)" ]; then
            echo "No changes."
            exit 0
          fi
          git add blog/index.html blog/latest.json index.html thumb/
          git commit -m "blog listing: auto-refresh cards + banner + thumbs [skip ci]"
          git push
